<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OFERTAL · Productos y servicios cerca de ti</title>
  <meta name="description" content="OFERTAL: compra, vende y contrata servicios cerca de ti en Colombia. Publica gratis o cuenta qué necesitas y recibe propuestas de proveedores de tu zona.">
  <meta name="keywords" content="ofertal, marketplace, productos, servicios, comprar, vender, clasificados, colombia, proveedores">
  <meta name="theme-color" content="#4f46e5">
  <meta property="og:title" content="OFERTAL · Productos y servicios cerca de ti">
  <meta property="og:description" content="Compra, vende y contrata servicios cerca de ti. Publicar es gratis.">
  <meta property="og:image" content="assets/img/logo-512.png">
  <link rel="icon" type="image/png" href="assets/img/logo-192.png">
  <link rel="apple-touch-icon" href="assets/img/logo-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <div id="avisoGlobal" class="hidden bg-indigo-600 text-white text-sm text-center px-4 py-2 font-medium"></div>
  <div id="bannerUbicacion" class="hidden"></div>

  <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-4">
      <a href="#inicio" class="text-2xl sm:text-3xl font-extrabold tracking-tighter text-slate-800 shrink-0" aria-label="OFERTAL, inicio">OFERTAL<span class="text-indigo-600">.</span></a>
      <div id="zonaBuscador" class="hidden md:block grow max-w-xl">
        <div class="relative" data-buscador>
          <input id="buscarDesktop" type="search" autocomplete="off" aria-label="Buscar" placeholder="Buscar productos, servicios o municipios…" class="campo !pl-10 !rounded-full !bg-slate-50">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">🔍</span>
        </div>
      </div>
      <nav id="navAcciones" class="ml-auto flex items-center gap-1 sm:gap-2"></nav>
    </div>
    <div id="buscadorMovil" class="md:hidden px-4 pb-3">
      <div class="relative" data-buscador>
        <input id="buscarMovil" type="search" autocomplete="off" enterkeyhint="search" aria-label="Buscar" placeholder="Buscar en OFERTAL…" class="campo !pl-10 !rounded-full !bg-slate-50">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">🔍</span>
      </div>
    </div>
  </header>

  <main id="app" class="grow w-full max-w-7xl mx-auto px-4 pb-28 md:pb-16">
    <div class="py-24 text-center text-slate-400">Cargando OFERTAL…</div>
  </main>

  <footer class="hidden md:block border-t border-slate-100 bg-white">
    <div class="max-w-7xl mx-auto px-4 md:pr-56 py-8 flex flex-wrap gap-6 justify-between items-center text-sm text-slate-500">
      <div>
        <p class="text-xl font-extrabold tracking-tighter text-slate-800">OFERTAL<span class="text-indigo-600">.</span></p>
        <p class="text-xs mt-1">Compra, vende y contrata cerca de ti · © <span id="anio"></span> · Responsable: Cesar Santana</p>
      </div>
      <div class="flex gap-5">
        <a href="#como-funciona" class="hover:text-indigo-600">Cómo funciona</a>
        <a href="#solicitudes" class="hover:text-indigo-600">Solicitudes</a>
        <a href="#soporte" class="hover:text-indigo-600">Ayuda y soporte</a>
        <a href="#terminos" class="hover:text-indigo-600">Términos y condiciones</a>
      </div>
    </div>
  </footer>

  <!-- Navegación inferior (móvil) -->
  <nav id="navInferior" class="md:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200 z-30 safe-bottom" aria-label="Navegación principal">
    <div class="grid grid-cols-5 h-16 text-[10px] font-semibold">
      <a href="#inicio" data-ruta="inicio" class="flex flex-col items-center justify-center gap-0.5 text-slate-500"><span class="text-xl">🏠</span><span>Inicio</span></a>
      <a href="#solicitudes" data-ruta="solicitudes" class="flex flex-col items-center justify-center gap-0.5 text-slate-500"><span class="text-xl">🙋</span><span>Solicitudes</span></a>
      <button data-accion="publicar" class="flex flex-col items-center justify-center" aria-label="Publicar">
        <span class="w-12 h-12 -mt-5 rounded-full bg-indigo-600 text-white text-3xl leading-none grid place-items-center shadow-lg shadow-indigo-600/30 ring-4 ring-white">＋</span>
      </button>
      <a href="#mensajes" data-ruta="mensajes" class="relative flex flex-col items-center justify-center gap-0.5 text-slate-500"><span class="text-xl relative">💬<span id="badgeChatMovil" class="punto-badge hidden"></span></span><span>Mensajes</span></a>
      <a href="#perfil" data-ruta="perfil" class="flex flex-col items-center justify-center gap-0.5 text-slate-500"><span class="text-xl">👤</span><span>Cuenta</span></a>
    </div>
  </nav>

  <!-- Soporte interno (reemplaza el antiguo botón de WhatsApp) -->
  <a href="#soporte" class="hidden md:flex fixed bottom-6 right-6 z-20 items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-3 rounded-full shadow-xl transition hover:scale-105 text-sm">
    🛟 Ayuda y soporte
  </a>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
